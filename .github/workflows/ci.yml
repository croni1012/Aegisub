name: Meson CI

permissions:
  contents: read

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows MSVC Release
            os: windows-latest
            msvc: true
            buildtype: release
            arch: x86_64
            args: >-
              -Ddefault_library=static
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng
              -Dfallback_nasm=true
              -Dfreetype2:harfbuzz=disabled
              -Dharfbuzz:freetype=disabled
              -Dharfbuzz:cairo=disabled
              -Dharfbuzz:glib=disabled
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
          #- {
          #  name: Windows MinGW,
          #  os: windows-latest,
          #  msvc: false
          #}
          - {
            name: Ubuntu Debug,
            os: ubuntu-latest,
            buildtype: debugoptimized,
            arch: x86_64,
            args: -Db_pch=false -Ddefault_library=static --prefix=/usr
          }
          - {
            name: Ubuntu Release,
            os: ubuntu-22.04,
            buildtype: release,
            arch: x86_64,
            args: -Db_pch=false -Ddefault_library=static --prefix=/usr
          }
          - {
            name: Ubuntu AppImage,
            os: ubuntu-latest,
            buildtype: release,
            args: -Db_pch=false,
            appimage: true
          }
          - {
            name: macOS x86_64 Debug,
            os: macos-15-intel,
            buildtype: debugoptimized,
            arch: x86_64,
            args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          }
          - {
            name: macOS x86_64 Release,
            os: macos-15-intel,
            buildtype: release,
            arch: x86_64,
            args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          }
          - {
            name: macOS arm64 Debug,
            os: macos-15,
            buildtype: debugoptimized,
            arch: arm64,
            args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          }
          - {
            name: macOS arm64 Release,
            os: macos-15,
            buildtype: release,
            arch: arm64,
            args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set package version
        run: python -c "import os; v = os.environ.get('GITHUB_REF_NAME', 'continuous'); v = v[1:] if os.environ.get('GITHUB_REF_TYPE') == 'tag' and v.startswith('v') else 'continuous'; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('PACKAGE_VERSION=' + v + '\nPACKAGE_BASENAME=Aegisub-nyaa-edition-v' + v + '\n')"

      - name: Setup Meson
        run: |
          python -m pip install --upgrade pip setuptools
          pip install meson

      - name: Setup MSVC
        if: matrix.config.os == 'windows-latest' && matrix.config.msvc == true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.config.os == 'windows-latest'
        run: |
          choco install ninja innosetup 7zip -y --no-progress

          $moonscripturl = "https://github.com/leafo/moonscript/releases/download/v0.6.0/moonscript-v0.6.0-windows-x86_64.zip"
          mkdir moonscript
          Invoke-WebRequest -Uri $moonscripturl -OutFile ".\moonscript\moonscript.zip"
          pushd moonscript
          7z e moonscript.zip
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

          $gettexturl = "https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.18-r3/gettext1.0-iconv1.18-static-64.zip"
          Invoke-WebRequest -Uri $gettexturl -OutFile ".\gettext.zip"
          Expand-Archive ".\gettext.zip" -DestinationPath gettext
          pushd gettext/bin
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

      - name: Install dependencies (MacOS)
        if: startsWith(matrix.config.os, 'macos-')
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          # Skip brew update for now, see https://github.com/actions/setup-python/issues/577
          # brew update
          brew install ninja
          brew install libass zlib ffms2 fftw hunspell
          brew install pulseaudio  # NO OpenAL in github CI

      - name: Install dependencies (Linux)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build build-essential libx11-dev libfreetype6-dev pkg-config libfontconfig1-dev libass-dev libasound2-dev libffms2-dev intltool libboost-all-dev libhunspell-dev libcurl4-openssl-dev libuchardet-dev libgtest-dev libgmock-dev libportal-gtk3-dev libsecret-1-dev
          if apt-cache show libwxgtk3.2-dev >/dev/null 2>&1; then
            sudo apt-get install libwxgtk3.2-dev
          fi
          if [[ "${{ matrix.config.os }}" == "ubuntu-22.04" ]]; then
            # GCC 11's libstdc++ cannot convert UTF-8 filesystem paths to wstring.
            sudo apt-get install gcc-12 g++-12
            echo "CC=gcc-12" >> "$GITHUB_ENV"
            echo "CXX=g++-12" >> "$GITHUB_ENV"
          fi

      - name: Install AppImage tooling
        if: matrix.config.appimage
        run: |
          sudo apt-get update
          sudo apt-get install -y wget desktop-file-utils libfuse2
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

      - name: Configure
        run: meson setup build ${{ matrix.config.args }} -Dbuildtype=${{ matrix.config.buildtype }} ${{ github.ref_type == 'tag' && '-Dofficial_release=true' || '' }}

      - name: Build
        run: meson compile -C build

      - name: Run test
        run: meson test -C build --verbose "gtest main"

      - name: Generate Ubuntu AppImage
        if: matrix.config.appimage
        run: |
          set -e
          appdir="$GITHUB_WORKSPACE/appimage"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/pixmaps"

          cp build/aegisub "$appdir/usr/bin/aegisub"
          chmod +x "$appdir/usr/bin/aegisub"

          desktop_file=$(find build -name '*.desktop' | head -n 1)
          if [ -n "$desktop_file" ]; then
            cp "$desktop_file" "$appdir/usr/share/applications/"
          fi

          icon_name=$(grep '^Icon=' "$desktop_file" | cut -d= -f2- | tr -d '\r')
          icon_src=$(find packages/desktop -path '*/aegisub.png' | head -n 1)
          if [ -n "$icon_src" ]; then
            for size in 16 22 24 32 48 64 128 256; do
              mkdir -p "$appdir/usr/share/icons/hicolor/${size}x${size}/apps"
              cp "$icon_src" "$appdir/usr/share/icons/hicolor/${size}x${size}/apps/${icon_name}.png"
            done
            cp "$icon_src" "$appdir/usr/share/pixmaps/${icon_name}.png"
          fi

          if [ ! -f "$appdir/usr/share/applications"/*.desktop ]; then
            echo "No desktop file found for AppImage packaging" >&2
            exit 1
          fi

          /tmp/linuxdeploy.AppImage --appdir "$appdir" \
            -e "$appdir/usr/bin/aegisub" \
            -d "$appdir/usr/share/applications"/*.desktop \
            -i "$appdir/usr/share/icons/hicolor/256x256/apps/${icon_name}.png" \
            --output appimage

          appimage_path=$(find . -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [ -z "$appimage_path" ]; then
            echo "AppImage was not produced" >&2
            exit 1
          fi

          mv "$appimage_path" "Aegisub-Ubuntu.AppImage"

      - name: Upload artifacts - Ubuntu AppImage
        uses: actions/upload-artifact@v6
        if: matrix.config.appimage
        with:
          name: ${{ matrix.config.name }} - appimage
          path: Aegisub-Ubuntu.AppImage
          if-no-files-found: error

      # Windows artifacts
      - name: Generate Windows installer
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          meson compile win-installer -C build

      - name: Generate Windows portable installer
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        run: cd build && ninja win-portable

      - name: Prepare Windows release assets
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        shell: pwsh
        run: |
          $installer = Get-ChildItem build -Filter 'Aegisub-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not generated.' }
          $installerTarget = "$env:PACKAGE_BASENAME.exe"
          if ($installer.Name -ne $installerTarget) {
            Copy-Item -LiteralPath $installer.FullName -Destination "build/$installerTarget" -Force
          }
          Copy-Item -LiteralPath 'build/aegisub-portable-64.zip' -Destination "build/$env:PACKAGE_BASENAME-portable.zip" -Force
          python tools/release/package_update.py --build-dir build --output "build/$env:PACKAGE_BASENAME-update.zip"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        with:
          name: release-windows-installer
          path: build/${{ env.PACKAGE_BASENAME }}.exe
          if-no-files-found: error

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        with:
          name: release-windows-portable
          path: build/${{ env.PACKAGE_BASENAME }}-portable.zip
          if-no-files-found: error

      - name: Upload Windows update package
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'windows-latest' && matrix.config.buildtype == 'release'
        with:
          name: release-windows-update
          path: build/${{ env.PACKAGE_BASENAME }}-update.zip
          if-no-files-found: error

      # macOS artifacts
      - name: Generate macOS installer
        if: startsWith(matrix.config.os, 'macos-') && matrix.config.buildtype == 'release'
        env:
          AEGISUB_PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          meson compile osx-bundle -C build
          meson compile osx-build-dmg -C build

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v6
        if: startsWith(matrix.config.os, 'macos-') && matrix.config.buildtype == 'release'
        with:
          name: release-macos-${{ matrix.config.arch }}
          path: build/${{ env.PACKAGE_BASENAME }}-${{ matrix.config.arch }}.dmg
          if-no-files-found: error

      # Linux AppImage
      - name: Generate Linux AppImage
        if: matrix.config.name == 'Ubuntu Release'
        run: bash tools/build-appimage.sh build "build/${PACKAGE_BASENAME}-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        if: matrix.config.name == 'Ubuntu Release'
        with:
          name: release-linux-appimage
          path: build/${{ env.PACKAGE_BASENAME }}-x86_64.AppImage
          if-no-files-found: error

      # Tarball
      - name: Generate tarball
        if: matrix.config.name == 'Ubuntu Release'
        run: |
          set -e

          meson dist --include-subprojects -C build

          # Make sure the subprojects we need are included
          mkdir distcheck
          tar -xJf build/meson-dist/*.tar.xz -C distcheck/
          test -e distcheck/*/subprojects/luabins/meson.build
          test -e distcheck/*/subprojects/LuaJIT*/meson.build
          cp build/meson-dist/*.tar.xz "build/${PACKAGE_BASENAME}.tar.xz"

      - name: Upload source tarball
        uses: actions/upload-artifact@v6
        if: matrix.config.name == 'Ubuntu Release'
        with:
          name: release-source-tarball
          path: build/${{ env.PACKAGE_BASENAME }}.tar.xz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="Aegisub-nyaa-edition-v${version}"
          for asset in \
            "${base}.exe" \
            "${base}-portable.zip" \
            "${base}-update.zip" \
            "${base}-arm64.dmg" \
            "${base}-x86_64.dmg" \
            "${base}-x86_64.AppImage" \
            "${base}.tar.xz"
          do
            test -s "release-assets/${asset}"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="Aegisub-nyaa-edition-v${version}"
          title="nyaa's edition v${version}"
          python tools/release/github_release_notes.py \
            --changelog changelog/en.txt \
            --version "${version}" \
            --output release-notes.md
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${title}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release edit "${TAG}" --title "${title}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          fi
          gh release upload "${TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"

          while IFS= read -r asset; do
            case "${asset}" in
              "${base}.exe"|\
              "${base}-portable.zip"|\
              "${base}-update.zip"|\
              "${base}-arm64.dmg"|\
              "${base}-x86_64.dmg"|\
              "${base}-x86_64.AppImage"|\
              "${base}.tar.xz") ;;
              *) gh release delete-asset "${TAG}" "${asset}" --yes --repo "${GITHUB_REPOSITORY}" ;;
            esac
          done < <(gh release view "${TAG}" --json assets --jq '.assets[].name' --repo "${GITHUB_REPOSITORY}")

          test "$(gh release view "${TAG}" --json assets --jq '.assets | length' --repo "${GITHUB_REPOSITORY}")" -eq 7
